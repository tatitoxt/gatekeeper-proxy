name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit + integration (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:coverage
      - name: Dependency audit (fails on high/critical)
        run: npm audit --audit-level=high

  e2e:
    name: E2E (gateway process + Playwright dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npx playwright test
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    name: Docker Compose demo smoke test
    runs-on: ubuntu-latest
    env:
      GATEKEEPER_ADMIN_TOKEN: ci-token-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d
      - name: Proxy, WAF and admin API respond
        run: |
          for i in $(seq 1 30); do curl -fs localhost:8000/api/v1/hello && break; sleep 1; done
          curl -fs localhost:8000/api/v1/hello | grep -q demo-upstream-900
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:8000/api/v1/x?q=%3Cscript%3E')" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/metrics)" = 401
          curl -fs -H "authorization: Bearer $GATEKEEPER_ADMIN_TOKEN" localhost:8080/api/metrics | grep -q '"wafBlocks":1'
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
